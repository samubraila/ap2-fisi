<title>AP2 Lernzentrale FiSi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: sticky Kopfzeile mit Reiter-Navigation, darunter eine Ansicht pro Reiter, max. 1080px breit */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eaeef4; --line:#d5dce6;
  --fg:#15202b; --muted:#5a6878; --accent:#1d5fc4; --accent-ink:#ffffff; --mark:#f2a33a; --mark-soft:#fdf0dc;
  --good:#23824f; --good-soft:#e1f3e8; --warn:#b07a06; --warn-soft:#fbf1d6; --bad:#c0392b; --bad-soft:#fbe4e1;
  --heat0:#eef1f5; --heat1:#cfe0f7; --heat2:#8fb6ec; --heat3:#3f7fd6; --accent-soft:#e7effc;
  --f-display:"Space Grotesk",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:14px; --shadow:0 1px 2px rgba(16,32,56,.05),0 8px 24px rgba(16,32,56,.07); --shadow-lg:0 2px 6px rgba(16,32,56,.1),0 18px 44px rgba(16,32,56,.16);
  /* Bühne der 3D-Ansicht: in beiden Designs bewusst dunkel */
  --stage-a:#0a1220; --stage-b:#1c2f4f; --stage-fg:#eaf1fb; --stage-muted:#a9b9cf; --stage-line:rgba(255,255,255,.17); --stage-glass:rgba(12,20,34,.74); --stage-btn:rgba(255,255,255,.09); --stage-accent:#4d94ff; --stage-ink:#07101d; --stage-good:#5fcf8e; --stage-bad:#ff8a7a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#151e28; --surface2:#1c2733; --line:#2a3846;
  --fg:#e5ecf3; --muted:#93a3b4; --accent:#6aa5ff; --accent-ink:#0b1420; --mark:#f0a64a; --mark-soft:#3a2c17;
  --good:#5fcf8e; --good-soft:#163024; --warn:#e3b23c; --warn-soft:#352a10; --bad:#ff7b6b; --bad-soft:#3a1a17;
  --heat0:#1a2430; --heat1:#1f3b5e; --heat2:#2f62a3; --heat3:#5b9bf0; --accent-soft:#162538; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.26); --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#151e28; --surface2:#1c2733; --line:#2a3846;
  --fg:#e5ecf3; --muted:#93a3b4; --accent:#6aa5ff; --accent-ink:#0b1420; --mark:#f0a64a; --mark-soft:#3a2c17;
  --good:#5fcf8e; --good-soft:#163024; --warn:#e3b23c; --warn-soft:#352a10; --bad:#ff7b6b; --bad-soft:#3a1a17;
  --heat0:#1a2430; --heat1:#1f3b5e; --heat2:#2f62a3; --heat3:#5b9bf0; --accent-soft:#162538; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.26); --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:radial-gradient(1100px 420px at 50% -80px,var(--accent-soft),transparent 72%) no-repeat var(--bg);color:var(--fg);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.65rem;letter-spacing:-.012em}h3{font-size:1.1rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopfzeile */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.brand h1{font-size:1.15rem;letter-spacing:.01em}
.brand h1 span{color:var(--accent)}
.savechip{font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.savechip.ok{background:var(--good-soft);color:var(--good)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:6px 9px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:6px 13px;border-radius:99px;font-weight:500;font-size:.9rem;transition:background .15s,color .15s}
nav.tabs a:hover{color:var(--fg);background:var(--surface2)}
nav.tabs a[aria-current="page"]{color:var(--accent-ink);background:var(--accent);font-weight:600}

main{padding-block:22px 60px}
section.view{display:grid;gap:20px}
section.view:not([hidden]){animation:viewIn .28s ease-out}
@keyframes viewIn{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.lead{max-width:68ch;color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;min-width:0;box-shadow:var(--shadow)}
.panel.flat{background:transparent;border-style:dashed;box-shadow:none}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:600}
.panel .eyebrow,.readiness .eyebrow{color:var(--muted)}
.kpi{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1}
.kpi small{font-size:.9rem;font-weight:500;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:10px;cursor:pointer;font-weight:500;transition:border-color .15s,background .15s,box-shadow .15s,filter .15s,transform .06s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 32%,transparent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:.85rem;border-radius:8px}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.chip.hot{background:var(--bad-soft);color:var(--bad)}
.chip.mid{background:var(--warn-soft);color:var(--warn)}
.chip.low{background:var(--good-soft);color:var(--good)}
.chip.ga1{background:var(--heat1);color:var(--fg)}
.chip.ga2{background:var(--mark-soft);color:var(--fg)}
.chip.wiso{background:var(--surface2);color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
label.field{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
input[type=number],input[type=text],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input.ok{border-color:var(--good);background:var(--good-soft)}
input.no{border-color:var(--bad);background:var(--bad-soft)}
.note{border-left:3px solid var(--mark);background:var(--mark-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:.9rem}
ul.clean{list-style:none;padding:0;margin:0;display:grid;gap:6px}
ul.facts{margin:0;padding-left:18px;display:grid;gap:4px}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* Heatmap */
table.heat{min-width:760px}
table.heat td.c{text-align:center;padding:4px}
table.heat td.c span{display:block;height:24px;border-radius:5px;background:var(--heat0)}
table.heat td.c span.on{background:var(--heat3)}
table.heat tr.topic{cursor:pointer}
table.heat tr.topic:hover td{background:var(--surface2)}
table.heat tr.sel td{background:var(--surface2)}
table.heat th.term{text-align:center;font-family:var(--f-mono);font-size:.72rem}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s ease}

/* Karten */
.card{min-height:220px;display:grid;align-content:center;gap:14px;text-align:center;padding:28px 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card .q{font-family:var(--f-display);font-size:1.25rem;font-weight:500;max-width:52ch;margin:0 auto}
.card .a{max-width:60ch;margin:0 auto;text-align:left;border-top:1px dashed var(--line);padding-top:14px;white-space:pre-line}
.boxes{display:flex;gap:6px}
.boxes div{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
.boxes b{display:block;font-family:var(--f-display);font-size:1.2rem;color:var(--fg)}

/* Trainer */
.task{display:grid;gap:12px}
.task .prompt{font-size:1rem}
.task .fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.sol{background:var(--surface2);border-radius:8px;padding:12px;font-size:.92rem;white-space:pre-line}
.trainer-list{display:flex;flex-wrap:wrap;gap:6px}
.trainer-list button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.86rem}
.trainer-list button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Quiz */
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.opt input{margin-top:4px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* Notenrechner */
.rule{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--surface2)}
.rule i{font-style:normal;font-weight:700;width:20px;flex:0 0 20px;text-align:center}
.rule.ok i{color:var(--good)} .rule.no i{color:var(--bad)}
.verdict{padding:14px 16px;border-radius:10px;font-weight:600}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict.open{background:var(--surface2);color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:.78rem;text-align:center}
.scale div{padding:6px 2px;border-radius:6px;background:var(--surface2)}
.scale div.cur{background:var(--accent);color:var(--accent-ink)}

/* Erklärungen und Zeichnungen im Rechen-Trainer */
details.howto summary{font-family:var(--f-display);font-size:1.02rem}
.howto-body{display:grid;gap:10px;margin-top:10px;max-width:80ch}
.howto-body ol{margin:0;padding-left:20px;display:grid;gap:4px}
.howto-body td,.howto-body th{padding:4px 8px;white-space:nowrap}
.steps{border-left:3px solid var(--accent);padding:2px 0 2px 14px;display:grid;gap:6px}
.steps ol{margin:0;padding-left:20px;display:grid;gap:7px}
.fig{margin:0;display:grid;gap:6px;min-width:0}
.fig svg{display:block;height:auto}
svg .t{fill:var(--fg);font-family:var(--f-mono);font-size:12px}
svg .tm{fill:var(--muted);font-family:var(--f-mono);font-size:12px}
svg .ta{fill:var(--accent)}
svg .f-acc-t{fill:var(--accent-ink)}
svg .f-net{fill:var(--heat1)}
svg .f-host{fill:var(--mark-soft);stroke:var(--mark);stroke-width:.7}
svg .f-sub{fill:var(--surface2)}
svg .f-box{fill:var(--surface);stroke:var(--line)}
svg .f-acc{fill:var(--accent)}
svg .f-muted{fill:var(--muted)}
svg .f-good{fill:var(--good-soft);stroke:var(--good)}
svg .f-bad{fill:var(--bad-soft);stroke:var(--bad)}
svg .f-warn{fill:var(--warn-soft);stroke:var(--warn)}
svg .f-c1{fill:var(--heat2)}
svg .f-c2{fill:var(--mark-soft);stroke:var(--mark)}
svg .f-c3{fill:var(--good-soft);stroke:var(--good)}
svg .f-c4{fill:var(--warn-soft);stroke:var(--warn)}
svg .s-line{stroke:var(--muted);stroke-width:1;fill:none}
svg .s-acc{stroke:var(--accent);stroke-width:2;fill:none}
svg .s-dash{stroke-dasharray:5 4}
svg .s-bad{stroke:var(--bad);stroke-width:1.6;fill:none}
svg .s-good{stroke:var(--good);stroke-width:2;fill:none}
svg .f-badsolid{fill:var(--bad)}
svg .f-goodsolid{fill:var(--good)}

/* Kopfzeile: Logo */
.brand-l{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent-ink);font:700 12px var(--f-display);letter-spacing:.03em}

/* „Heute dran“ / „Jetzt weitermachen“ */
.hero-next{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px 18px;border-radius:16px;background:linear-gradient(120deg,var(--accent-soft),var(--surface));border:1px solid var(--line);box-shadow:var(--shadow)}
.hero-next .btn{white-space:nowrap}
.hero-title{font-family:var(--f-display);font-size:1.2rem;line-height:1.25;text-wrap:balance}
.hero-next.big{padding:20px 22px}
.hero-next.big .hero-title{font-size:1.45rem}
.ring-bg{fill:none;stroke:var(--surface2);stroke-width:8}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round}
.ring-t{fill:var(--fg);font:700 16px var(--f-display)}

/* Lektion */
.lesson-head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);padding:4px 10px 4px 4px;border-radius:99px;background:var(--surface2)}
.stepper i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface);font-weight:700;font-size:.75rem}
.stepper li.ok{color:var(--good);background:var(--good-soft)}
.stepper li.ok i{background:var(--good);color:var(--surface)}
.lesson-sec{gap:14px;padding:18px}
.prose{display:grid;gap:10px;max-width:72ch;line-height:1.62}
.exam-q{padding:12px 14px;border:1px dashed var(--line);border-radius:8px;background:var(--surface2);font-weight:500}
textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;resize:vertical;font:inherit;color:inherit;min-width:0}
.card.mini{min-height:140px;padding:20px}

/* Lernplan */
.week{display:grid;gap:10px}
.week h3{display:flex;gap:10px;align-items:baseline}
.days{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.day{display:grid;gap:8px;align-content:start}
.dhead{display:flex;gap:8px;align-items:center;font-size:.85rem}
.tcard{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.tcard:hover{box-shadow:var(--shadow)}
.tcard .tname{font-weight:600;line-height:1.3}
.tcard .btn{justify-self:start;text-decoration:none}
.tcard.done{background:var(--good-soft);border-color:transparent}
.tcard.started{border-color:var(--warn)}
.tcard.exam{background:var(--surface2)}
/* Suche */
.search{position:relative;flex:1 1 260px;max-width:380px;min-width:0}
.search input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:.9rem}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;min-width:min(92vw,360px);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:30;padding:4px}
.sr{padding:8px 10px;border-radius:8px;cursor:pointer;display:grid;gap:2px}
.sr:hover{background:var(--surface2)}
.sr-ans{white-space:pre-line;padding-top:4px;color:var(--fg)}
@media (max-width:640px){.brand{flex-wrap:wrap}.search{order:3;flex:1 1 100%;max-width:none}.sres{min-width:0}.exam-bar{top:calc(env(safe-area-inset-top,0px) + 150px)}}

/* Prüfungsbereitschaft, Lernserie, Schwachstellen */
.readiness{gap:16px;padding:18px}
.ready-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ready-parts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.rp{display:grid;gap:4px}
ul.todo li{padding:8px 10px;border-radius:8px;background:var(--surface2)}
.weak{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--surface2)}
svg .hm1{fill:var(--heat1)} svg .hm2{fill:var(--heat2)} svg .hm3{fill:var(--heat3)}
svg .hm-today{stroke:var(--accent);stroke-width:2}

/* Probeprüfung */
.exam-pick{gap:10px}
.exam-pick .btn{justify-self:start}
.exam-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 104px);z-index:4;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.ex-timer{font-size:1.15rem}
.ex-timer.low{color:var(--bad)}
.exam-task{gap:14px}
.exam-item{display:grid;gap:8px}
.exam-task .exam-item+.exam-item{border-top:1px dashed var(--line);padding-top:12px}
.exam-result{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--line)}
a.btn{display:inline-block;text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
details{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
details summary{cursor:pointer;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:5px;width:16px;height:16px;flex:0 0 16px}
.check.done span.t{color:var(--muted);text-decoration:line-through}
/* Hardware in 3D: links die dunkle Bühne mit dem Modell, rechts die Erklärung; am Handy untereinander */
.hw-layout{display:grid;gap:14px;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
@media (max-width:880px){.hw-layout{grid-template-columns:minmax(0,1fr)}}
.hw-stage{position:relative;height:clamp(400px,66vh,620px);border-radius:18px;overflow:hidden;background:radial-gradient(120% 85% at 50% 0%,var(--stage-b),var(--stage-a) 72%);color:var(--stage-fg);border:1px solid var(--stage-line);box-shadow:var(--shadow-lg)}
@media (min-width:881px){.hw-stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px)}}
.hw-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab;outline:0}
.hw-stage canvas.hit{cursor:pointer}
.hw-stage canvas.drag{cursor:grabbing}
.hw-dots{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hw-stage.quizmode .hw-dots,.hw-stage.failed .hw-dots,.hw-stage.failed .hw-bar{display:none}
.hw-dot{position:absolute;left:0;top:0;width:28px;height:28px;margin:-14px 0 0 -14px;padding:0;border:0;background:none;cursor:pointer;pointer-events:auto;color:var(--stage-fg)}
.hw-dot i{position:absolute;inset:8px;border-radius:50%;background:var(--stage-fg);box-shadow:0 0 0 4px var(--stage-line);transition:transform .15s,background .15s}
.hw-dot.seen i{background:var(--stage-good)}
.hw-dot:hover i,.hw-dot.hov i,.hw-dot.sel i{transform:scale(1.35);background:var(--stage-accent)}
.hw-dot.sel i{animation:hwPulse 1.6s ease-out infinite}
@keyframes hwPulse{from{box-shadow:0 0 0 0 var(--stage-accent)}to{box-shadow:0 0 0 14px transparent}}
.hw-dot b{position:absolute;left:50%;bottom:calc(100% - 2px);transform:translateX(-50%);white-space:nowrap;font:600 .74rem var(--f-body);padding:3px 9px;border-radius:99px;background:var(--stage-glass);border:1px solid var(--stage-line);opacity:0;pointer-events:none;transition:opacity .12s}
.hw-dot:hover b,.hw-dot:focus-visible b,.hw-dot.hov b,.hw-dot.sel b,.hw-stage.names .hw-dot b{opacity:1}
.hw-dot:hover,.hw-dot.hov,.hw-dot.sel{z-index:2}
.hw-bar{position:absolute;left:12px;right:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;pointer-events:none}
.hw-bar>*{pointer-events:auto}
.hw-top{top:12px}.hw-bot{bottom:12px;justify-content:flex-end}
.hw-hint{font-size:.76rem;color:var(--stage-muted);pointer-events:none}
@media (max-width:1040px){.hw-hint{display:none}}
.hw-btn{background:var(--stage-btn);border:1px solid var(--stage-line);color:var(--stage-fg);border-radius:99px;padding:6px 13px;font-size:.82rem;font-weight:500;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .15s}
.hw-btn:hover{background:var(--stage-line)}
.hw-btn[aria-pressed="true"],.hw-btn.on{background:var(--stage-accent);border-color:var(--stage-accent);color:var(--stage-ink);font-weight:600}
.hw-btn.sq{width:32px;padding:6px 0;text-align:center;font-weight:700}
.hw-seg{display:flex;gap:4px;padding:3px;border-radius:99px;background:var(--stage-glass);border:1px solid var(--stage-line)}
.hw-seg .hw-btn{border-color:transparent;background:transparent}
.hw-seg .hw-btn[aria-pressed="true"]{background:var(--stage-accent)}
.hw-quiz{position:absolute;left:12px;right:12px;top:62px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--stage-glass);border:1px solid var(--stage-line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font-size:.92rem}
.hw-quiz.ok{border-color:var(--stage-good)}.hw-quiz.no{border-color:var(--stage-bad)}
.hw-quiz-t{flex:1 1 220px;min-width:0}
.hw-quiz-n{font:600 .78rem var(--f-mono);color:var(--stage-muted)}
.hw-load{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--stage-muted);pointer-events:none}
.hw-info{gap:13px;align-content:start;padding:20px}
.hw-info h3{font-size:1.3rem}
.hw-short{font-size:1.02rem;font-weight:500}
.hw-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hw-facts div{display:grid;gap:1px;align-content:start;padding:8px 9px;border-radius:9px;background:var(--surface2);min-width:0}
.hw-facts span{font-size:.7rem;color:var(--muted);letter-spacing:.02em}
.hw-facts b{font:600 .8rem/1.3 var(--f-mono);overflow-wrap:anywhere}
.hw-sec{display:grid;gap:5px}
.hw-sec ul{font-size:.93rem}
.hw-server{font-size:.9rem;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.hw-steps{margin:0;padding-left:20px;display:grid;gap:7px}
.hw-nav{border-top:1px solid var(--line);padding-top:12px}
.hw-list button.seen{border-color:var(--good);color:var(--good)}
.hw-list button.seen[aria-pressed="true"]{color:var(--accent-ink);border-color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){h2{font-size:1.25rem}.kpi{font-size:1.6rem}}
